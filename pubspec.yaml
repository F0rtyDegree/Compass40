name: compass40
description: >
  Компас для Android с расширенными функциями.
  Показывает направление, используя магнитные сенсоры или данные GPS, и отображает детальную информацию: координаты, скорость и высоту. 
  Умеет работать с картами: пользователь может загрузить изображение карты, привязать его к GPS-координатам и отслеживать свое местоположение на этой карте в реальном времени.
publish_to: 'none'
version: 6.5.3
environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  permission_handler: ^12.0.3

  gps_info:
    path: packages/gps_info
  my_compass:
    path: packages/my_compass
  shared_preferences: ^2.5.4
  provider: ^6.1.5+1
  package_info_plus: ^9.0.0
  collection: ^1.19.1
  equatable: ^2.0.8
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  flutter_markdown: ^0.7.7+1
  file_picker: ^11.0.2
  xml: ^6.3.0

  # НОВЫЕ ЗАВИСИМОСТИ ДЛЯ ФОНОВОЙ ЗАПИСИ ТРЕКА
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^17.0.0
  intl: ^0.20.3
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/help/
